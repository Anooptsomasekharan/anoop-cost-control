<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anoop Group of Restaurants · Cost Control &amp; Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
 --bg:#f4f4f1;--card:#ffffff;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
 --side:#13233b;--sideInk:#c9d3e3;--sideMuted:#7f8ea8;--sideOn:#ffffff;--sideOnBg:rgba(255,255,255,.10);
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--info:#2a78d6;--goodText:#006300;--badText:#b42323;
 --tip:#0b0b0b;--tipInk:#f0efec;--hl:#fff6e5;--sel:#eef4fd;}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0d0d0d;--card:#1a1a19;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
 --side:#111a29;--sideInk:#b9c3d3;--sideMuted:#6c7a92;--sideOnBg:rgba(255,255,255,.08);
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --goodText:#0ca30c;--badText:#ff8a80;--info:#3987e5;--tip:#f0efec;--tipInk:#0b0b0b;--hl:#2a2418;--sel:#1d2a3d;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
 --bg:#0d0d0d;--card:#1a1a19;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
 --side:#111a29;--sideInk:#b9c3d3;--sideMuted:#6c7a92;--sideOnBg:rgba(255,255,255,.08);
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --goodText:#0ca30c;--badText:#ff8a80;--info:#3987e5;--tip:#f0efec;--tipInk:#0b0b0b;--hl:#2a2418;--sel:#1d2a3d;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--s1);text-decoration:none}a:hover{text-decoration:underline}
.app{display:flex;height:100vh}
#side{width:236px;flex:none;background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--sideMuted)}
#nav{padding:8px 10px 20px}
.ng{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--sideMuted);padding:14px 10px 5px;font-weight:600}
#nav a{display:block;color:var(--sideInk);padding:7px 10px;border-radius:7px;font-size:13px;margin:1px 0}
#nav a:hover{background:var(--sideOnBg);text-decoration:none;color:#fff}
#nav a.on{background:var(--sideOnBg);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #5aa2ff}
.sidefoot{margin-top:auto;padding:14px 18px;font-size:11px;color:var(--sideMuted);border-top:1px solid rgba(255,255,255,.08)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar h1{font-size:19px;margin:0;font-weight:650}
.topbar .vsub{color:var(--muted);font-size:12px}
.filters{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
#menuBtn{display:none}
#view{flex:1;overflow-y:auto;padding:20px 24px 40px}
.inp,select.inp{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 9px;min-height:32px}
.inp.full{width:100%;margin-bottom:8px}
.btn{font:inherit;font-size:12.5px;border-radius:7px;padding:6px 11px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn.ghost{background:transparent}.btn:hover{border-color:var(--s1);text-decoration:none}
.lead{margin:0 0 10px}.note{font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:6px;padding:3px 8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;min-width:0}
.kpi.hl{background:var(--hl)}
.kl{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font-size:22px;font-weight:650;margin:3px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks{font-size:11.5px;color:var(--muted);min-height:16px}
.d{font-weight:600}.d.g{color:var(--goodText)}.d.b{color:var(--badText)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid.g-recipe{grid-template-columns:290px minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px;min-width:0}
.card.span2{grid-column:1/-1}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ch>div:first-child{flex:1;min-width:0}
.card h3{margin:0;font-size:14px;font-weight:650}
.sub{margin:3px 0 0;font-size:12px;color:var(--muted)}
.chart{position:relative;width:100%}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--axis);cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0;background:var(--card)}
th.sorted{color:var(--ink)}
td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sel)}tr.sel td{background:var(--sel)}
tfoot td,tr.tot td{font-weight:650;border-top:1px solid var(--axis)}
.tbl.small table{font-size:12px}.tbl.small td,.tbl.small th{padding:5px 6px}
td.empty{text-align:center;color:var(--muted);padding:18px}
.more{margin-top:8px}
.nw{white-space:nowrap}.muted{color:var(--muted)}.small{font-size:11.5px}.pad{padding:10px 2px}
.neg{color:var(--badText);font-weight:600}.pos{color:var(--goodText);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 3px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--ink);white-space:nowrap}
.pill b{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;color:#fff}
.pill.good b{background:var(--good)}.pill.warn b{background:var(--warn);color:#0b0b0b}.pill.serious b{background:var(--serious)}.pill.crit b{background:var(--crit)}.pill.info b{background:var(--info)}
.minibar{width:90px;height:7px;background:var(--grid);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--s1);border-radius:4px}
.spark{display:block}
.alerts{list-style:none;margin:0 0 10px;padding:0}
.alerts li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.alerts li span{flex:1}.alerts li .pill{min-width:132px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:inherit;font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--s1);border-color:var(--s1);color:#fff}
.row-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row-tools .chips{margin:0}
.chk{font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.dhead{margin-bottom:8px}
.recon td{padding:7px 8px}.recon tr.tot td{font-weight:700}.recon tr.sep td{border-top:1px solid var(--axis);color:var(--ink2)}
.recon tr.h td{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding-top:14px}
.rlist{max-height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.ritem{font:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.ritem small{display:block;color:var(--muted);font-size:11px}
.ritem:hover{background:var(--sel)}.ritem.on{background:var(--sel);border-color:var(--s1)}
#rlines .inp.q{width:76px;padding:3px 6px;min-height:26px;text-align:right}
.rsum{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 10px;padding:12px;border-radius:10px;background:var(--bg)}
.rsum label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.rsum label .inp{width:120px}
#rres,#drres{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.rk span{display:block;font-size:11.5px;color:var(--muted)}.rk b{font-size:17px;margin-right:6px}
.rk.wi{font-size:11.5px;color:var(--badText);font-weight:600}
.prose p{margin:0 0 9px}.prose ul{margin:0 0 9px;padding-left:18px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tip);color:var(--tipInk);padding:9px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1200px){.kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
 #side{position:fixed;left:-250px;top:0;bottom:0;z-index:40;transition:left .2s}
 body.navopen #side{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
 #menuBtn{display:inline-block}
 .grid,.grid.g-recipe{grid-template-columns:minmax(0,1fr)}
 #view{padding:14px}.topbar{padding:10px 14px}
 .filters{margin-left:0;width:100%}
}

/* ===== motion layer ===== */
.brand{display:flex;gap:11px;align-items:center}
#brandLogo{flex:none}
.blogo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;display:block;padding:3px}
.blogo.ph{background:rgba(255,255,255,.06);display:grid;place-items:center;padding:6px}
.blogo.ph svg,.ilogoimg.ph svg{width:100%;height:100%}
#nav{position:relative}
#navInd{position:absolute;left:10px;right:10px;top:0;border-radius:7px;background:var(--sideOnBg);box-shadow:inset 3px 0 0 #f28c00;opacity:0;transition:transform .38s cubic-bezier(.3,.8,.2,1),height .38s;pointer-events:none;z-index:0}
#nav a{position:relative;z-index:1}
#nav a.on{background:transparent;box-shadow:none}
.still #navInd{transition:none}
.sidetools{padding:10px 14px 0;display:flex;flex-wrap:wrap;gap:6px}
.sbtn{font:inherit;font-size:11.5px;color:var(--sideInk);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:5px 9px;cursor:pointer}
.sbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.sbtn:focus-visible,.btn:focus-visible,#nav a:focus-visible{outline:2px solid #f6c343;outline-offset:2px}
::view-transition-old(root){animation:vtOut .18s ease-in both}
::view-transition-new(root){animation:vtIn .34s cubic-bezier(.2,.7,.1,1) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(6px)}}
#view.enter{animation:vtIn .34s cubic-bezier(.2,.7,.1,1)}
.card .tbl tr.sel td{transition:background .25s}
#rcard .rk b{display:inline-block;transition:color .2s}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 110%,#3a130a 0%,#1b1512 45%,#120e0c 100%);color:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer}
#embers{position:absolute;inset:0;width:100%;height:100%}
.sear{position:absolute;inset:-10% -20%;display:flex;flex-direction:column;justify-content:center;gap:5.2vh;pointer-events:none}
.sear i{display:block;height:1.1vh;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 15%,rgba(40,18,10,.85) 50%,rgba(0,0,0,.55) 85%,transparent);box-shadow:0 0 22px rgba(226,56,27,.25)}
.ibox{position:relative;text-align:center;padding:24px;cursor:default}
.ilogo{width:132px;height:132px;margin:0 auto 22px;border-radius:30px;background:rgba(255,255,255,.96);display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 20px 60px rgba(226,56,27,.35),0 0 120px rgba(242,140,0,.25)}
.ilogoimg{max-width:100px;max-height:100px;display:block}
.ilogoimg.ph{width:84px;height:84px}
.iname{font-size:clamp(28px,4.4vw,52px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
.iline{margin-top:6px;font-size:15px;color:#e8c9a8}
.istat{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:4px}
.inum{font-size:clamp(30px,5vw,58px);font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 20%,#f6c343 70%,#f28c00);-webkit-background-clip:text;background-clip:text;color:transparent}
.ilab{font-size:13px;color:#cdb39a}
.ibar{width:min(340px,70vw);height:3px;margin:26px auto 0;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.ibar i{display:block;height:100%;background:linear-gradient(90deg,#e2381b,#f28c00,#f6c343);transform-origin:left}
.iskip{position:absolute;right:22px;bottom:20px;font:inherit;font-size:12.5px;color:#e8c9a8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:7px 14px;cursor:pointer}
.iskip:hover{color:#fff;background:rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}#view.enter{animation:none}}
.still ::view-transition-old(root),.still ::view-transition-new(root){animation:none}

/* ===== details drawer ===== */
a.lnk{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--s1) 55%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px}
a.lnk:hover{color:var(--s1)}
#dscrim{position:fixed;inset:0;background:rgba(10,12,18,.38);z-index:59;backdrop-filter:blur(1.5px)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100vw);background:var(--bg);z-index:60;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25);border-left:1px solid var(--border)}
#dscrim[hidden],#drawer[hidden]{display:none}
.dbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
.dbar span{flex:1}
#dbody{flex:1;overflow-y:auto;padding:18px 20px 40px}
.dh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.dh>div{flex:1;min-width:0}
.dh h2{margin:0;font-size:21px;line-height:1.2}
.dh p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--axis);margin:6px 0 14px;overflow-x:auto}
.dtab{font:inherit;font-size:13px;background:none;border:0;padding:9px 12px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.dtab.on{color:var(--ink);font-weight:650;border-bottom-color:#f28c00}
.dpane h4{margin:18px 0 8px;font-size:13px}
.kpis.dk{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpis.dk .kv{font-size:18px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--grid);border-radius:10px;overflow:hidden;margin:6px 0 12px}
.facts div{background:var(--card);padding:9px 11px;box-shadow:0 0 0 .5px var(--grid)}
.facts dt{font-size:11.5px;color:var(--muted)}.facts dd{margin:2px 0 0;font-weight:600;font-size:13px}
.dissues{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.impact{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.impact div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.impact span{display:block;font-size:11.5px;color:var(--muted)}.impact b{font-size:15px}.impact small{display:block;color:var(--muted);font-size:11px}
#drlines .inp.q{width:76px;padding:3px 6px;min-height:26px;text-align:right}
#drlines tr.chg td{background:var(--hl)}
.warnnote{display:block;margin-top:12px;border-style:solid;border-color:var(--serious);color:var(--ink)}
body.dopen{overflow:hidden}
@media (max-width:700px){.kpis.dk,.impact{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}#dbody{padding:14px}}

/* ===== 2026-11 visual refresh: pine + saffron ===== */
:root{--bg:#f2f5f1;--card:#ffffff;--surface:#fbfcfa;--ink:#12201b;--ink2:#4a5852;--muted:#85918b;--grid:#e4e9e5;--axis:#c6cec9;--border:rgba(18,32,27,.09);
 --side:#0e2a23;--sideInk:#bcd0c8;--sideMuted:#7d978d;--sideOnBg:rgba(255,255,255,.09);--accent:#f2a516;--hl:#fff4d6;--sel:#e9f2ed;--tip:#12201b;
 --fd:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;--fb:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--bg:#0b110f;--side:#08130f;--sel:#17251f;--hl:#2b2413;--border:rgba(255,255,255,.09);--sideOnBg:rgba(255,255,255,.08);--tip:#f0efec;--ink:#f0efec;--ink2:#c3c2b7;--card:#1a1a19;--surface:#1a1a19;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"]{--ink:#f0efec;--ink2:#c3c2b7;--card:#1a1a19;--surface:#1a1a19;--grid:#2c2c2a;--axis:#383835}
body{font-family:var(--fb);font-size:14px;letter-spacing:-.003em}
h1,h2,h3,.kv,.brand b,.dh h2,.iname,.inum,.rk b,.impact b{font-family:var(--fd);letter-spacing:-.015em}
#side{width:248px}
.brand{padding:22px 20px 18px;border-bottom:0}
.brand b{font-size:18px;font-weight:700}
.ng{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;padding:18px 12px 6px}
#nav a{padding:8px 12px;border-radius:10px;font-size:13.5px}
#navInd{border-radius:10px;box-shadow:inset 3px 0 0 var(--accent)}
.sidefoot{border-top:0;opacity:.85}
.sbtn{border-radius:999px;padding:6px 11px}
.topbar{background:var(--bg);border-bottom:0;padding:22px 30px 6px}
.topbar h1{font-size:27px;font-weight:700}
.topbar .vsub{font-size:13px}
#view{padding:16px 30px 60px}
.inp,select.inp{border-radius:10px;min-height:36px;background:var(--card)}
.btn{border-radius:999px;padding:7px 14px;background:var(--card)}
.btn:hover{border-color:var(--ink)}
.kpis{gap:14px;margin-bottom:18px}
.kpi{position:relative;border-radius:18px;padding:16px 18px 15px;border:1px solid var(--border);transition:transform .18s,box-shadow .18s}

/* ===== login & user access ===== */
#login{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(110% 80% at 15% 0%,#1c4a3c 0%,#0e2a23 55%,#081a15 100%)}
.lg-card{width:min(400px,100%);background:#fff;color:#12201b;border-radius:24px;padding:30px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column}
.lg-brand{border-left:4px solid #f2a516;padding-left:12px;margin-bottom:22px}.lg-brand b{display:block;font-family:var(--fd);font-size:19px;line-height:1.2}.lg-brand span{font-size:13px;color:#4a5852}
.lg-card h2{font-family:var(--fd);font-size:30px;margin:0 0 14px;line-height:1.1}
.lg-card label{font-size:13px;font-weight:600;margin:10px 0 5px;color:#12201b}
.lg-card input:not([type=checkbox]){font:inherit;font-size:16px;width:100%;padding:12px 14px;border:1.5px solid #c6cec9;border-radius:12px;background:#fbfcfa;color:#12201b}
.lg-card input:focus-visible,.ua-form input:focus-visible{outline:3px solid #f2a516;outline-offset:1px;border-color:#0e2a23}
.lg-pw{position:relative}.lg-pw input{padding-right:70px!important}.lg-pw button{position:absolute;right:6px;top:6px;bottom:6px;border:0;background:#e9f2ed;color:#0e2a23;font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:0 12px;cursor:pointer}
.lg-keep{display:flex!important;align-items:center;gap:8px;font-weight:500!important;margin-top:14px!important}.lg-keep input{width:18px;height:18px;accent-color:#0e2a23}
.lg-err{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#fdecea;color:#8f1d12;font-size:13.5px}
.lg-go{margin-top:18px;font:inherit;font-size:16px;font-weight:700;padding:13px;border:0;border-radius:12px;background:#f2a516;color:#12201b;cursor:pointer}.lg-go:hover{background:#ffb72e}.lg-go:disabled{opacity:.6;cursor:wait}
.lg-foot{margin:14px 0 0;font-size:12.5px;color:#4a5852;text-align:center}
#who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}#who:empty{display:none}
.who-n{min-width:0}.who-n b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who-n span{font-size:11.5px;color:var(--sideMuted)}
.ua-act{white-space:nowrap;text-align:right}.ua-act .btn{margin-left:6px}
.btn.ua-save{background:var(--side);color:#fff;border-color:var(--side);font-weight:600}.btn.ua-danger{background:#b3261e;color:#fff;border-color:#b3261e}
.ua-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.ua-form label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:5px}
.ua-form input:not([type=checkbox]){font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--axis);border-radius:10px;background:var(--surface);color:var(--ink)}
.ua-form input:disabled{opacity:.6}.ua-form small{font-weight:400;color:var(--muted);font-size:12px}
.ua-form label.ua-chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;padding:5px 0}.ua-chk input{width:18px;height:18px;accent-color:var(--side);flex:none}
.ua-ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0 8px}.ua-ph .btn{margin-left:6px}
.ua-pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ua-pages fieldset{border:1px solid var(--border);border-radius:14px;padding:8px 14px 10px;margin:0;background:var(--surface)}.ua-pages legend{font-size:12px;font-weight:700;color:var(--ink2);padding:0 6px}
.ua-btns{display:flex;gap:8px;margin-top:16px}.ua-btns .btn{padding:10px 20px;font-size:14px}
.ua-note{margin:0;max-width:86ch;color:var(--ink2);font-size:13.5px;line-height:1.5}
@media (max-width:700px){.ua-act{text-align:left;white-space:normal}.ua-act .btn{margin:4px 6px 0 0}.lg-card{padding:24px 20px 20px}}
#replay,#intro{display:none!important}

 if(m){const cur=new Map(),prv=new Map();WASTE.forEach(w=>{if(w.m===m)cur.set(w.sku,(cur.get(w.sku)||0)+w.v);if(w.m===m-1)prv.set(w.sku,(prv.get(w.sku)||0)+w.v)});
  cur.forEach((v,s)=>{const p=prv.get(s)||0;if(v>400&&p&&v>p*1.4)add('warn','Wastage','Chef',`${s.name}: wastage up ${fmtD((v-p)/p,0)} MoM (${fmtQ(v)})`,'wastage',v-p)})}
 appPricing(m,'all').forEach(x=>{if(x.am<.15)add(x.am<.08?'serious':'warn','Delivery margin','Operations',`${x.name}: only ${fmtP(x.am)} net margin on delivery apps after commission, promos and packaging (dine-in earns QAR ${fmtM(x.dn)} per item, apps QAR ${fmtM(x.an)})`,'channels',x.lost)});

}
function skuStock(m){return SKUS.map(s=>{const u=s.m[m];const par=u.daily*s.parDays;const cover=u.close/(u.daily||1);
 let status='OK';if(u.close<par*.6)status='Below par';else if(u.close>par*1.8)status=s.shelf<=30?'Expiry risk':'Overstock';
 if(status==='OK'&&s.shelf<=14&&u.expDays<=1&&cover>2)status='Expiry risk';
 return{s,code:s.code,name:s.name,cat:s.cat,onHand:u.close,par,daily:u.daily,cover,status,exp:status==='Expiry risk'?Math.max(0,Math.min(u.expDays,Math.floor(cover)-1)):u.expDays,reorder:(status==='Expiry risk'||status==='Overstock')?0:Math.max(0,par*1.2-u.close),value:u.closeV,price:u.grpoAvg,mom:m?(u.grpoAvg-s.m[m-1].grpoAvg)/s.m[m-1].grpoAvg:0}})}

 const steps=[['Theoretical',a.theo],['Over-portion',a.over],['Wastage',a.waste],['Shrinkage',a.shrink],['Purchase loss',a.ploss],['Valuation',resid]].filter((x,i)=>i<5||Math.abs(x[1])>a.theo*.0005);let run=0;const base=[],val=[];

function menuRows(m,o){const out=[];if(o==='all'){Object.keys(CONCEPTS).forEach(ck=>{const rs=MENU.filter(mi=>!mi.noME&&mi.concept===ck);
 const agg_=rs.map(mi=>{const rr_=RECIPES.filter(r=>r.menu===mi);const sold=sum(rr_,r=>RM[r.i][m].sold),act=sum(rr_,r=>RM[r.i][m].act);return{r:rr_[0],name:mi.name,outlet:mi.section,sold,mix:0,price:mi.price,cost:act/sold,cm:mi.price-act/sold,totCm:(mi.price-act/sold)*sold}});
 const tot=sum(agg_,x=>x.sold);agg_.forEach(x=>x.mix=x.sold/tot);const avgCm=sum(agg_,i=>i.totCm)/tot,popT=.7/agg_.length;agg_.forEach(i=>{i.avgCm=avgCm;i.popT=popT;const hp=i.mix>=popT,hc=i.cm>=avgCm;i.cls=hp&&hc?'Star':hp?'Plowhorse':hc?'Puzzle':'Dog';out.push(i)})});return out}
 OUTLETS.filter(x=>x.id===o).forEach(ot=>{const rs=RECIPES.filter(r=>r.outlet===ot.id&&!r.menu.noME);const tot=sum(rs,r=>RM[r.i][m].sold);
 const items=rs.map(r=>{const x=RM[r.i][m];const unit=x.act/x.sold;return{r,name:r.name,outlet:ot.name,sold:x.sold,mix:x.sold/tot,price:r.price,cost:unit,cm:r.price-unit,totCm:(r.price-unit)*x.sold}});
 const avgCm=sum(items,i=>i.totCm)/tot,popT=.7/rs.length;
 items.forEach(i=>{const hp=i.mix>=popT,hc=i.cm>=avgCm;i.cls=hp&&hc?'Star':hp?'Plowhorse':hc?'Puzzle':'Dog';i.avgCm=avgCm;i.popT=popT;out.push(i)})});return out}

function bevUsage(m,o){const map=new Map();recipesOf(o).filter(r=>r.bev).forEach(r=>RM[r.i][m].lines.forEach(l=>{let x=map.get(l.sku);if(!x){x={sku:l.sku,theoQ:0,actQ:0,theoV:0,overV:0,waste:0,recipes:new Set()};map.set(l.sku,x)}
 x.theoQ+=l.theoQ;x.actQ+=l.actQ;x.theoV+=l.theoV;x.overV+=l.overV;x.waste+=l.wasteV;x.recipes.add(r.name)}));
 return[...map.values()].map(x=>Object.assign(x,{name:x.sku.name,varQ:x.actQ-x.theoQ,varPct:(x.actQ-x.theoQ)/x.theoQ,nRec:x.recipes.size}))}

function countUp(root){if(!MOTION.on)return;root.querySelectorAll('.kv').forEach((el,i)=>{const t=el.textContent;const m=t.match(/^(.*?)(−?)([\d,]+(?:\.\d+)?)(.*)$/);if(!m)return;

 const fmt=v=>m[1]+m[2]+(comma?v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):v.toFixed(dec))+m[4];
 el.textContent=fmt(0);const step=now=>{const p=Math.max(0,Math.min(1,(now-t0)/dur));el.textContent=fmt(target*ease(p));if(p<1)requestAnimationFrame(step);else el.textContent=t};requestAnimationFrame(step)})}

 return `<svg width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`}
function bridge(id,steps,maker,fmt){maker=maker||mk;fmt=fmt||fmtQ;let run=0;const data=[],cols=[],vals=[];
 steps.forEach(([l,v,t])=>{if(t==='start'){data.push([0,v]);run=v;cols.push(S(0));vals.push(v)}else if(t==='end'){data.push([0,run]);cols.push(S(2));vals.push(run)}else{data.push(v<0?[run+v,run]:[run,run+v]);run+=v;cols.push(S(1));vals.push(v)}});
 const base=vals[0]||1,pct=i=>{const t=Math.abs(vals[i]/base*100).toFixed(1)+'%';return vals[i]<0?'−'+t:t};
 const labels={id:'bridgeLabels',afterDatasetsDraw(ch){const c=ch.ctx,ff=Chart.defaults.font.family;c.save();c.textAlign='center';
  ch.getDatasetMeta(0).data.forEach((el,i)=>{const top=Math.min(el.y,el.base);c.fillStyle=cv('--ink');c.font='600 12.5px '+ff;c.fillText(pct(i),el.x,top-19);c.fillStyle=cv('--muted');c.font='11px '+ff;c.fillText(fmt(Math.abs(vals[i])).replace('QAR ',''),el.x,top-6)});c.restore()}};

 return maker(id,{type:'bar',data:{labels:steps.map(s=>s[0]),datasets:[{label:'QAR',data,backgroundColor:cols,borderRadius:5,borderSkipped:false,maxBarThickness:52}]},options:o,plugins:[labels]})}

  :[RECIPES.filter(r=>r.outlet===o&&!r.menu.noME).map(r=>({mi:r.menu,rs:[r],lab:r.menu.sec}))];
 groups.forEach(g=>{const items=g.map(({mi,rs,lab})=>{const t=meItem(rs,m),u=t.units;
   return{r:rs[0],name:mi.name,outlet:lab,sold:u,mix:0,price:mi.price,cost:(t.food+t.pack)/u,foodU:t.food/u,packU:t.pack/u,feesU:t.fees/u,discU:t.disc/u,chanU:(t.fees+t.disc)/u,cm:t.net/u,netPct:t.net/t.gross,totCm:t.net,rev:t.gross,parts:{food:t.food,pack:t.pack,fees:t.fees,disc:t.disc,net:t.net}}});
  const tot=sum(items,x=>x.sold),avgCm=sum(items,i=>i.totCm)/tot,popT=.7/items.length;
  items.forEach(i=>{i.mix=i.sold/tot;i.avgCm=avgCm;i.popT=popT;const hp=i.mix>=popT,hc=i.cm>=avgCm;i.cls=hp&&hc?'Star':hp?'Plowhorse':hc?'Puzzle':'Dog';out.push(i)})});
 return out}

function appPricing(m,o){const map=new Map();recipesOf(o).forEach(r=>{let x=map.get(r.menu);if(!x){x={r,name:r.name,sec:r.section,price:r.price,d:{u:0,net:0},a:{u:0,gross:0,keep:0,fp:0,net:0}};map.set(r.menu,x)}
  CH[r.i][m].forEach((c,i)=>{if(i===0){x.d.u+=c.units;x.d.net+=c.contrib}else if(CHANNELS[i].type==='Aggregator'){x.a.u+=c.units;x.a.gross+=c.gross;x.a.keep+=c.gross-c.disc-c.comm-c.fee;x.a.fp+=c.food+c.pack;x.a.net+=c.contrib}})});

function sha256(str){
 const K=[],H=[];let n=2,c=0;const fr=x=>((x-Math.floor(x))*4294967296)|0;
 while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)H[c]=fr(Math.pow(n,.5));K[c++]=fr(Math.pow(n,1/3))}n++}
 const b=Array.from(new TextEncoder().encode(str)),l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
 for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
 const rr=(x,k)=>(x>>>k)|(x<<(32-k));const h=H.slice();
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let [a,bb,cc,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  [a,bb,cc,d,e,f,g,hh].forEach((v,i)=>h[i]=(h[i]+v)|0)}
 return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}

 $('#theme').onclick=()=>{const d=document.documentElement;const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem('cc-theme',d.dataset.theme)}catch(e){}render()};
 $('#menuBtn').onclick=()=>document.body.classList.toggle('navopen');
 $('#logoIn').onchange=e=>readLogo(e.target.files[0]);$('#logoRemove').onclick=()=>{setLogo(null);toast('Logo removed')};
 $('#replay').onclick=()=>playIntro(true);
 const mb=$('#motionBtn');const paintM=()=>{mb.textContent=MOTION.on?'Motion: on':'Motion: off';mb.setAttribute('aria-pressed',MOTION.on);document.documentElement.classList.toggle('still',!MOTION.on)};paintM();
 mb.onclick=()=>{MOTION.on=!MOTION.on;paintM();render()};
 addEventListener('resize',moveIndicator);
 document.addEventListener('click',e=>{const a=e.target.closest('a.lnk[data-open]');if(!a)return;e.preventDefault();e.stopPropagation();openEntity(a.dataset.open)},true);
 $('#dclose').onclick=closeDrawer;$('#dscrim').onclick=closeDrawer;
 $('#dback').onclick=()=>{DSTACK.pop();const k=DSTACK[DSTACK.length-1];if(k)openEntity(k,false)};
 addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('intro'))closeDrawer()});
 document.addEventListener('click',e=>{const b=e.target.closest('[data-csv]');if(!b)return;const el=document.getElementById(b.dataset.csv);if(!el||!el._csv)return;
  try{navigator.clipboard.writeText(el._csv()).then(()=>toast('Table copied as CSV. Paste it into Excel.'),()=>toast('Copy was blocked by the browser'))}catch(err){toast('Copy was blocked by the browser')}});
 window.addEventListener('hashchange',route);
 try{const t=localStorage.getItem('cc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200)}
function route(){const k=(location.hash||'').slice(1);if(!AUTH.me)return;STATE.view=AUTH.pick(k);if(k&&V[k]&&STATE.view!==k)toast('You do not have access to that page.');document.body.classList.remove('navopen');render()}
function render(){transition(renderNow)}
function renderNow(){
 if(typeof closeDrawer==='function'&&!$('#drawer').hidden)closeDrawer();
 CHARTS.forEach(c=>c.destroy());CHARTS=[];setChartDefaults();chartMotion();
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===STATE.view));moveIndicator();
 $('#vtitle').textContent=TITLES[STATE.view];
 $('#vsub').textContent=`${MONTHS[STATE.m]} · ${STATE.o==='all'?'All outlets':OUT[STATE.o].name}`;
 const v=V[STATE.view];$('#view').innerHTML=(HELP[STATE.view]?`<p class="vhelp">${HELP[STATE.view]}</p>`:'')+v();if(v.after)v.after();
 $('#view').scrollTop=0;
 if(!introPlaying)countUp($('#view'));
}
shell();paintLogo();AUTH.start();
</script>
</body>
</html>
